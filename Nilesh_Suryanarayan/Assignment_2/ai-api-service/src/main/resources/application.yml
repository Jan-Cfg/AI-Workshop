server:
  servlet:
    context-path: /ai-api-service
  port: 8080

#cors:
#  origins:
#    - "http://localhost:4200"

ai:
  api:
    url: http://localhost:11434/api/chat

spring:
  jmx:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/ollama_local_ai
    username: postgres
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: hnsw
        distance-type: cosine-distance
        table-name: vector_store

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.coforgeaiworkshop: INFO
